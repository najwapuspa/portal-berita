# Railway Nixpacks Configuration for Laravel 13
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
